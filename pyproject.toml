[project]
name = "hardik-llm-lab"
version = "0.1.0"
description = "A from-scratch LLM research laboratory exploring tokenization, attention, GPT architectures, pretraining, fine-tuning, PEFT, evaluation, and model behavior through reproducible implementations and controlled experiments."
readme = "README.md"
authors = [{name = "Hardik Sankhla", email = "datascientist.hardiksankhla@gmail.com"}]
license = {text = "MIT"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "tiktoken>=0.5.1",
    "matplotlib>=3.7.1",
    "tensorflow>=2.15.0",
    "tqdm>=4.66.1",
    "numpy>=1.25,<2.0",
    "pandas>=2.2.1",
    "psutil>=5.9.5",
    "jupyterlab>=4.0",
    "pyyaml>=6.0",
    "mlflow>=2.0",
    "tensorboard>=2.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.0",
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]
experiments = [
    "wandb>=0.17",
    "optuna>=4.0",
]

[project.scripts]
hardik-llm = "hardik_llm.cli:main"
train = "hardik_llm.training.train:main"
generate = "hardik_llm.generation.generate:main"
evaluate = "hardik_llm.evaluation.evaluate:main"
experiment = "hardik_llm.experiments.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "PIE", "T20", "T10", "PER"]
ignore = ["S101", "T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"