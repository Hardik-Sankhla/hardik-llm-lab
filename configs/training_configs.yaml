# Training Configuration Templates

# Short run for experiments (1000 steps)
short:
  batch_size: 16
  max_seq_len: 512
  gradient_accumulation_steps: 4
  num_workers: 4
  learning_rate: 3e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1e-8
  max_steps: 1000
  warmup_steps: 100
  min_lr: 3e-5
  mixed_precision: true
  grad_clip: 1.0
  log_interval: 50
  eval_interval: 200
  save_interval: 500
  seed: 42
  deterministic: true

# Medium run (10000 steps)
medium:
  batch_size: 32
  max_seq_len: 1024
  gradient_accumulation_steps: 2
  num_workers: 4
  learning_rate: 3e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1e-8
  max_steps: 10000
  warmup_steps: 1000
  min_lr: 3e-5
  mixed_precision: true
  grad_clip: 1.0
  log_interval: 100
  eval_interval: 500
  save_interval: 2000
  seed: 42
  deterministic: true

# Full pretraining run (100000 steps)
full:
  batch_size: 32
  max_seq_len: 1024
  gradient_accumulation_steps: 1
  num_workers: 8
  learning_rate: 3e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1e-8
  max_steps: 100000
  warmup_steps: 2000
  min_lr: 3e-5
  mixed_precision: true
  grad_clip: 1.0
  log_interval: 100
  eval_interval: 1000
  save_interval: 5000
  seed: 42
  deterministic: true

# Fine-tuning config (smaller LR, fewer steps)
finetune:
  batch_size: 16
  max_seq_len: 1024
  gradient_accumulation_steps: 4
  num_workers: 4
  learning_rate: 1e-5
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  eps: 1e-8
  max_steps: 1000
  warmup_steps: 50
  min_lr: 1e-6
  mixed_precision: true
  grad_clip: 1.0
  log_interval: 25
  eval_interval: 100
  save_interval: 500
  seed: 42
  deterministic: true