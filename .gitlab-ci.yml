# Combined pipeline: Security + Build/Test (no Pages deploy - use GitHub Pages)

stages:
  - lint
  - test
  - security
  - build

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - .venv/

before_script:
  - python --version
  - pip install --upgrade pip
  - pip install -e ".[dev,experiments]"

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

lint:
  stage: lint
  script:
    - ruff check src/
    - black --check src/
    - mypy src/
  allow_failure: false

test:
  stage: test
  script:
    - pytest -v --cov=hardik_llm --cov-report=xml --cov-report=term-missing
  coverage: '/TOTAL.*\s+(\d+\.\d+%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    when: always
    expire_in: 1 week

# SAST job is auto-included from template; we just configure variables
sast:
  variables:
    SAST_EXCLUDED_PATHS: "reference/, notebooks/, experiments/, checkpoints/, assets/, .venv/, site/, public/, dist/"

secret_detection:
  variables:
    SECRET_DETECTION_ENABLED: 'true'
    SECRET_DETECTION_EXCLUDED_PATHS: "reference/, .venv/, site/, public/"

build:
  stage: build
  needs: [test]
  script:
    - pip install build
    - python -m build
    - pip check
  artifacts:
    paths:
      - dist/
    expire_in: 1 week